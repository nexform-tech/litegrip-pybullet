# Test gate.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# AGENTS.md is deliberately not linted: it is canonical content synced from
# repo-template and must not be edited here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          # pybullet links against OpenGL even for DIRECT (headless) connections,
          # so it fails to import on an image without libGL.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify pybullet Imports
        run: python -c "import pybullet; print(pybullet.getAPIVersion())"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md" "README.zh-CN.md" "examples/README.md" "examples/README.zh-CN.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"

      - name: Run Tests
        # No CAN interface and no display here, so the suite must not need either:
        # it skips hardware entirely and runs PyBullet headless.
        run: python3 -m pytest -q
